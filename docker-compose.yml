services:
  mongo:
    image: mongo:7
    container_name: mes-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: mes-api
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      MES_DB_BACKEND: mongo
      MES_MONGODB_URL: mongodb://mongo:27017
      MES_MONGODB_DB: osat_mes
      MES_JWT_SECRET: ${MES_JWT_SECRET:-please-change-me-in-production}
      MES_FACTORY_CODE: OSAT-KH1
      MES_TZ_OFFSET_HOURS: "8"
    ports:
      - "8000:8000"

volumes:
  mongo-data:
