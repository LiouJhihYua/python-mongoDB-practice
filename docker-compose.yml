services:
  postgres:
    image: postgres:16-alpine
    container_name: mes-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: mes
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mes}
      POSTGRES_DB: osat_mes
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mes -d osat_mes"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: mes-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      MES_DB_BACKEND: postgres
      MES_DATABASE_URL: postgresql://mes:${POSTGRES_PASSWORD:-mes}@postgres:5432/osat_mes
      MES_JWT_SECRET: ${MES_JWT_SECRET:-please-change-me-in-production}
      MES_FACTORY_CODE: OSAT-KH1
      MES_TZ_OFFSET_HOURS: "8"
    ports:
      - "8000:8000"

volumes:
  pg-data:
